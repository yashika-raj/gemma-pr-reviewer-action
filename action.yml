name: 'Gemma PR Reviewer'
description: 'Automated pull request reviews for security, performance and readability, powered by Gemini 2.5 Flash.'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  gemini_api_key:
    description: 'Google Gemini API key. Store it as a repository secret, never in plain text.'
    required: true
  github_token:
    description: 'Token used to read the pull request and post the review comment. Needs `pull-requests: write`.'
    required: true
    default: ${{ github.token }}
  model:
    description: 'Gemini model used for the review.'
    required: false
    default: 'gemini-2.5-flash'
  max_diff_chars:
    description: 'Maximum number of diff characters sent to the model. Larger diffs are truncated.'
    required: false
    default: '100000'
  fail_on_error:
    description: 'Fail the workflow step when the review cannot be produced (rate limits, API errors). Defaults to false so the review never blocks a pull request.'
    required: false
    default: 'false'

runs:
  using: 'docker'
  image: 'Dockerfile'
